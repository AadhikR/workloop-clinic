name: Migration foundation

on:
  push:
    branches:
      - migration/fastapi-keycloak
  pull_request:
    branches:
      - migration/fastapi-keycloak

permissions:
  contents: read

concurrency:
  group: migration-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip install --no-deps .
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m pyright
      - name: Check dependencies
        run: python -m pip check

  frontend-regression:
    name: Frontend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.11.1"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm run test:unit
      - name: Build frontend
        run: npm run build
      - name: Verify migration frontend isolation
        run: |
          npm run test:migration-build
          npm run build:migration

  full-stack-smoke:
    name: Full stack smoke
    needs:
      - backend-quality
      - frontend-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.11.1"
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate ephemeral credentials
        shell: pwsh
        run: ./scripts/new-local-postgres-env.ps1
      - name: Validate Compose configuration
        run: docker compose --profile tools config --quiet
      - name: Start local stack
        run: docker compose up --build --detach --wait postgres backend keycloak
      - name: Run Alembic
        run: docker compose --profile tools run --rm migrate
      - name: Verify repeatable migration
        run: docker compose --profile tools run --rm migrate
      - name: Verify empty-schema downgrade boundary
        run: |
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade base
          docker compose --profile tools run --rm migrate
      - name: Verify Alembic and database boundaries
        run: |
          test "$(docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini current | tail -n 1)" = "d307b9c1f25e (head)"
          test "$(docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini heads | tail -n 1)" = "d307b9c1f25e (head)"
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini check
          sh scripts/verify-phase-4b-schema.sh
          sh scripts/verify-phase-4c-schema.sh
          sh scripts/verify-phase-4c-migrations.sh
          sh scripts/verify-phase-4d-migrations.sh
          sh scripts/verify-phase-4d-grants.sh
          sh scripts/verify-phase-4d-triggers.sh
          sh scripts/verify-phase-4d-functions.sh
          sh scripts/verify-phase-4d-function-security.sh
          sh scripts/verify-phase-4d-shift-swap-concurrency.sh
          sh scripts/verify-phase-4e-seed.sh
          docker compose exec -T backend python -c "import os, psycopg; url=os.environ['DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://', 1); connection=psycopg.connect(url); cursor=connection.cursor(); cursor.execute('SELECT current_user'); assert cursor.fetchone() == ('workloop_runtime',); connection.close()"
      - name: Verify service health
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health | jq --exit-status '.status == "ok" and .database == "ok"'
          curl --fail --silent --show-error http://127.0.0.1:9000/health/ready | jq --exit-status '.status == "UP"'
      - name: Configure access-token subject
        run: |
          python scripts/configure-phase-3d-keycloak.py
          python scripts/configure-phase-3d-keycloak.py
      - name: Verify database boundaries
        run: |
          test "$(docker compose exec -T postgres psql --username postgres --dbname workloop --tuples-only --no-align --command "SELECT count(*) FROM pg_tables WHERE schemaname = 'public';")" = "55"
          test "$(docker compose exec -T postgres psql --username postgres --dbname keycloak --tuples-only --no-align --command "SELECT count(*) FROM realm;")" = "2"
      - name: Verify Keycloak and FastAPI authentication
        run: python scripts/verify-phase-3c-keycloak.py
      - name: Verify migration browser authentication
        run: npm run test:migration-auth
      - name: Verify initial service log safety
        run: sh scripts/verify-phase-3h-logs.sh
      - name: Record persisted signing keys
        run: curl --fail --silent --show-error http://127.0.0.1:8080/realms/workloop-dev/protocol/openid-connect/certs | jq -r '.keys[].kid' | sort > /tmp/workloop-signing-key-ids
      - name: Recreate local stack without removing data
        run: |
          docker compose down
          docker volume inspect workloop-clinic_postgres_data >/dev/null
          docker compose up --build --detach --wait postgres backend keycloak
          docker compose --profile tools run --rm migrate
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini check
          sh scripts/verify-phase-4b-schema.sh
          sh scripts/verify-phase-4c-schema.sh
          sh scripts/verify-phase-4d-grants.sh
          curl --fail --silent --show-error http://127.0.0.1:8080/realms/workloop-dev/protocol/openid-connect/certs | jq -r '.keys[].kid' | sort > /tmp/workloop-restarted-signing-key-ids
          diff /tmp/workloop-signing-key-ids /tmp/workloop-restarted-signing-key-ids
          python scripts/configure-phase-3d-keycloak.py
          python scripts/verify-phase-3c-keycloak.py
          npm run test:migration-auth
      - name: Verify cleanup and backend log safety
        run: |
          test "$(docker compose exec -T postgres psql --username postgres --dbname workloop --tuples-only --no-align --command 'SELECT count(*) FROM companies UNION ALL SELECT count(*) FROM branches UNION ALL SELECT count(*) FROM employees UNION ALL SELECT count(*) FROM app_users UNION ALL SELECT count(*) FROM user_profiles;' | sort -u)" = "0"
          python scripts/verify-phase-3c-keycloak.py
          sh scripts/verify-phase-3h-logs.sh
      - name: Show failure state
        if: failure()
        run: docker compose ps
      - name: Stop temporary stack
        if: always()
        run: docker compose down
