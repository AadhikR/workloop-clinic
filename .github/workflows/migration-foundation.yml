name: Migration foundation

on:
  push:
    branches:
      - migration/fastapi-keycloak
  pull_request:
    branches:
      - migration/fastapi-keycloak

permissions:
  contents: read

concurrency:
  group: migration-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip install --no-deps .
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m pyright
      - name: Check dependencies
        run: python -m pip check

  frontend-regression:
    name: Frontend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.11.1"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm run test:unit
      - name: Build frontend
        run: npm run build

  full-stack-smoke:
    name: Full stack smoke
    needs:
      - backend-quality
      - frontend-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Generate ephemeral credentials
        shell: pwsh
        run: ./scripts/new-local-postgres-env.ps1
      - name: Validate Compose configuration
        run: docker compose --profile tools config --quiet
      - name: Start local stack
        run: docker compose up --build --detach --wait postgres backend keycloak
      - name: Run Alembic
        run: docker compose --profile tools run --rm migrate
      - name: Verify identity schema
        run: sh ./scripts/verify-phase-3b-schema.sh
      - name: Verify repeatable migration
        run: docker compose --profile tools run --rm migrate
      - name: Verify empty-schema downgrade boundary
        run: |
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade base
          docker compose --profile tools run --rm migrate
      - name: Verify service health
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health | jq --exit-status '.status == "ok" and .database == "ok"'
          curl --fail --silent --show-error http://127.0.0.1:9000/health/ready | jq --exit-status '.status == "UP"'
      - name: Verify database boundaries
        run: |
          test "$(docker compose exec -T postgres psql --username postgres --dbname workloop --tuples-only --no-align --command "SELECT count(*) FROM pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema');")" = "0"
          test "$(docker compose exec -T postgres psql --username postgres --dbname keycloak --tuples-only --no-align --command "SELECT count(*) FROM realm;")" = "1"
      - name: Show failure logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop temporary stack
        if: always()
        run: docker compose down
