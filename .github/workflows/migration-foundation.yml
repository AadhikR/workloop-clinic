name: Migration foundation

on:
  push:
    branches:
      - migration/fastapi-keycloak
  pull_request:
    branches:
      - migration/fastapi-keycloak
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify and validate changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      full_stack: ${{ steps.classify.outputs.full_stack }}
      database_deep: ${{ steps.classify.outputs.database_deep }}
      database_history: ${{ steps.classify.outputs.database_history }}
      auth_deep: ${{ steps.classify.outputs.auth_deep }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "docs_only=false"
              echo "backend=true"
              echo "frontend=true"
              echo "full_stack=true"
              echo "database_deep=true"
              echo "database_history=true"
              echo "auth_deep=true"
            } >> "$GITHUB_OUTPUT"
            git show --check --format= "$HEAD_SHA"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha=$PR_BASE_SHA
          else
            base_sha=$BEFORE_SHA
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            git ls-files | awk '{ print "A\t" $0 }' > /tmp/workloop-changed-files
            git show --check --format= "$HEAD_SHA"
          else
            git diff --name-status --diff-filter=ACMRD "$base_sha" "$HEAD_SHA" > /tmp/workloop-changed-files
            git diff --check "$base_sha" "$HEAD_SHA"
          fi

          sh .github/scripts/classify-migration-workflow.sh < /tmp/workloop-changed-files

  backend-quality:
    name: Backend quality
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip install --no-deps .
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m pyright
      - name: Check dependencies
        run: python -m pip check

  frontend-regression:
    name: Frontend regression
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.11.1"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm run test:unit
      - name: Build frontend
        run: npm run build

  full-stack-smoke:
    name: Full stack smoke
    needs: changes
    if: needs.changes.outputs.full_stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: workloop-clinic
      COMPOSE_FILE: docker-compose.yml:docker-compose.phase11b.yml
      PHASE11B_S3_ACCESS_KEY: phase11b-ci-access
      PHASE11B_S3_SECRET_KEY: phase11b-ci-secret-key
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.11.1"
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate ephemeral credentials
        shell: pwsh
        run: |
          ./scripts/new-local-postgres-env.ps1
          $scannerLine = Get-Content ./backend/.env.postgres | Where-Object {
            $_.StartsWith("WORKLOOP_FILE_SCANNER_PASSWORD=")
          }
          if (-not $scannerLine) {
            throw "Generated scanner password is missing."
          }
          $scannerPassword = $scannerLine.Substring($scannerLine.IndexOf("=") + 1)
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value (
            "PHASE11B_SCANNER_DB_PASSWORD=$scannerPassword"
          )
      - name: Validate Compose configuration
        run: docker compose --profile tools config --quiet
      - name: Start local stack
        run: docker compose up --build --detach --wait postgres backend keycloak seaweed-s3
      - name: Run Alembic
        run: docker compose --profile tools run --rm migrate
      - name: Verify repeatable migration
        run: docker compose --profile tools run --rm migrate
      - name: Verify Phase 11C static boundaries
        run: python scripts/verify-phase-11c-revision.py static
      - name: Verify Phase 11C cutover boundaries
        run: |
          node --test tests/phase-11c-legacy-freeze.test.js
          node scripts/cutover-record-validator.mjs docs/migration/phase-11/cutover/employee-documents.json
          node scripts/cutover-record-validator.mjs docs/migration/phase-11/cutover/insurance.json
          node scripts/cutover-record-validator.mjs docs/migration/phase-11/cutover/employment-contracts.json
      - name: Verify Phase 11D static boundaries
        run: python scripts/verify-phase-11d-revision.py static
      - name: Verify Phase 11D cutover boundaries
        run: |
          node --test tests/phase-11d-legacy-freeze.test.js
          node scripts/cutover-record-validator.mjs docs/migration/phase-11/cutover/assets.json
          node scripts/cutover-record-validator.mjs docs/migration/phase-11/cutover/training-certifications-cme.json
      - name: Verify Phase 11B local storage contract
        run: docker compose run --rm --no-deps --env PYTHONPATH=/app --volume ./scripts:/verification:ro backend python /verification/verify-phase-11b-storage.py
      - name: Verify Phase 8D attachment contract
        run: python scripts/verify-phase-8d-attachments.py
      - name: Verify Phase 8E submission contract
        run: python scripts/verify-phase-8e-submission.py
      - name: Verify Phase 8F approval contract
        run: python scripts/verify-phase-8f-approval.py
      - name: Verify Phase 9B expense contract
        run: |
          python scripts/verify-phase-9b-expenses.py
          node --test tests/expense-api.test.js tests/phase-9b-legacy-freeze.test.js
      - name: Verify Phase 9C advance contract
        run: |
          python scripts/verify-phase-9c-advances.py
          node --test tests/advance-api.test.js tests/phase-9c-legacy-freeze.test.js
      - name: Verify Phase 9D payroll contract
        run: |
          python scripts/verify-phase-9d-payroll.py
          node --test tests/payroll-api.test.js tests/phase-9d-legacy-freeze.test.js
      - name: Verify Phase 9E payroll-input contract
        run: |
          python scripts/verify-phase-9e-payroll-inputs.py
          node --test tests/payroll-api.test.js tests/phase-9d-legacy-freeze.test.js tests/phase-9e-legacy-freeze.test.js
      - name: Verify Phase 9F approval and payslip contract
        run: |
          python scripts/verify-phase-9f-approval.py
          node --test tests/payroll-api.test.js tests/phase-9f-legacy-freeze.test.js
      - name: Verify Phase 9G WPS and Nafis contract
        run: |
          python scripts/verify-phase-9g-contract.py
          node --test tests/wps-nafis-api.test.js tests/phase-9g-legacy-freeze.test.js
      - name: Verify Phase 10B attendance configuration contract
        run: |
          node --test tests/migration-attendance-configuration.test.js tests/phase-10b-legacy-freeze.test.js
          node scripts/cutover-record-validator.mjs docs/migration/phase-10/cutover/attendance-configuration.json
      - name: Verify Phase 10G roster draft contract
        run: |
          node --test tests/migration-roster-drafts.test.js tests/phase-10g-legacy-freeze.test.js
          node scripts/cutover-record-validator.mjs docs/migration/phase-10/cutover/roster-drafting.json
      - name: Verify Phase 10I shift-swap contract
        run: |
          node --test tests/migration-shift-swaps.test.js tests/phase-10i-legacy-freeze.test.js
          node scripts/cutover-record-validator.mjs docs/migration/phase-10/cutover/shift-swaps.json
      - name: Verify Phase 10J completion boundary
        run: |
          node --test tests/phase-10j-boundary.test.js
          for record in docs/migration/phase-10/cutover/*.json; do
            case "$record" in */evidence-*) continue ;; esac
            node scripts/cutover-record-validator.mjs "$record"
          done
      - name: Verify empty-schema downgrade boundary
        if: needs.changes.outputs.database_deep == 'true'
        run: |
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade base
          docker compose --profile tools run --rm migrate
      - name: Verify Phase 5D exact downgrade
        if: needs.changes.outputs.database_history == 'true'
        run: |
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade d307b9c1f25e
          sh scripts/verify-phase-5d-downgrade.sh
          docker compose --profile tools run --rm migrate
      - name: Verify Phase 5E exact downgrade
        if: needs.changes.outputs.database_history == 'true'
        run: |
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade e418c0d7a6b3
          sh scripts/verify-phase-5e-downgrade.sh
          sh scripts/verify-phase-4d-grants.sh
          docker compose --profile tools run --rm migrate
      - name: Verify Phase 5F revision chain
        if: needs.changes.outputs.database_history == 'true'
        run: |
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade d85a6f0c3b42
          sh scripts/verify-phase-5f-revision.sh d85a6f0c3b42
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade c74f5e9b2a31
          sh scripts/verify-phase-5f-revision.sh c74f5e9b2a31
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade b63e4d8a1f20
          sh scripts/verify-phase-5f-revision.sh b63e4d8a1f20
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade f52e0a1b9c34
          sh scripts/verify-phase-5f-revision.sh f52e0a1b9c34
          sh scripts/verify-phase-5e-rls.sh
          sh scripts/verify-phase-4d-functions.sh
          sh scripts/verify-phase-4d-function-security.sh
          sh scripts/verify-phase-4d-shift-swap-concurrency.sh
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini upgrade b63e4d8a1f20
          sh scripts/verify-phase-5f-revision.sh b63e4d8a1f20
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini upgrade c74f5e9b2a31
          sh scripts/verify-phase-5f-revision.sh c74f5e9b2a31
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini upgrade d85a6f0c3b42
          sh scripts/verify-phase-5f-revision.sh d85a6f0c3b42
      - name: Verify Phase 5G revision chain
        if: needs.changes.outputs.database_history == 'true'
        run: |
          sh scripts/verify-phase-5g-chain.sh
          docker compose --profile tools run --rm migrate
      - name: Verify current Alembic state
        run: |
          docker compose --profile tools run --rm --entrypoint sh migrate -ec '
            current="$(alembic -c /app/alembic.ini current | tail -n 1)"
            heads="$(alembic -c /app/alembic.ini heads)"
            test "$(printf "%s\n" "$heads" | grep -c "(head)")" -eq 1
            test "$current" = "$heads"
            alembic -c /app/alembic.ini check
          '
          docker compose exec -T backend python -c "import os, psycopg; url=os.environ['DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://', 1); connection=psycopg.connect(url); cursor=connection.cursor(); cursor.execute('SELECT current_user'); assert cursor.fetchone() == ('workloop_runtime',); connection.close()"
      - name: Verify Phase 11B exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: |
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade c6e8a1b3d927
          docker compose --profile tools run --rm --env PYTHONPATH=/app --volume ./scripts:/verification:ro migrate python /verification/verify-phase-11b-revision.py predecessor
          docker compose --profile tools run --rm migrate
          docker compose --profile tools run --rm --env PYTHONPATH=/app --volume ./scripts:/verification:ro migrate python /verification/verify-phase-11b-revision.py head
      - name: Verify Phase 11C exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: |
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade d8f0a2c4e6b1
          docker compose --profile tools run --rm --env PYTHONPATH=/app --volume ./scripts:/verification:ro migrate python /verification/verify-phase-11c-revision.py predecessor
          docker compose --profile tools run --rm migrate
          docker compose --profile tools run --rm --env PYTHONPATH=/app --volume ./scripts:/verification:ro migrate python /verification/verify-phase-11c-revision.py head
      - name: Verify Phase 11D exact predecessor and head
        if: needs.changes.outputs.database_deep == 'true'
        run: |
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade e9a1b3d5f7c2
          docker compose --profile tools run --rm --env PYTHONPATH=/app --volume ./scripts:/verification:ro migrate python /verification/verify-phase-11d-revision.py predecessor
          docker compose --profile tools run --rm migrate
          docker compose --profile tools run --rm --env PYTHONPATH=/app --volume ./scripts:/verification:ro migrate python /verification/verify-phase-11d-revision.py head
      - name: Verify Phase 9H exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-9h-revision.sh
      - name: Verify Phase 10D exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-10d-revision.sh
      - name: Verify Phase 10E exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-10e-revision.sh
      - name: Verify Phase 10F exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-10f-revision.sh
      - name: Verify Phase 10G exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-10g-revision.sh
      - name: Verify Phase 10H exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-10h-revision.sh
      - name: Verify Phase 10I exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-10i-revision.sh
      - name: Verify Phase 10C exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-10c-revision.sh
      - name: Verify Phase 10B exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-10b-revision.sh
      - name: Verify Phase 9B exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-9b-revision.sh
      - name: Verify Phase 9C exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-9c-revision.sh
      - name: Verify Phase 9D exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-9d-revision.sh
      - name: Verify Phase 9E exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-9e-revision.sh
      - name: Verify Phase 9F exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-9f-revision.sh
      - name: Verify Phase 9G exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: sh scripts/verify-phase-9g-revision.sh
      - name: Verify Phase 8F exact predecessor
        if: needs.changes.outputs.database_deep == 'true'
        run: |
          docker compose --profile tools run --rm migrate alembic -c /app/alembic.ini downgrade e8f4c7b2a610
          sh scripts/verify-phase-8f-revision.sh
          docker compose --profile tools run --rm migrate
      - name: Verify database boundaries
        if: needs.changes.outputs.database_deep == 'true'
        run: |
          sh scripts/verify-phase-4b-schema.sh
          sh scripts/verify-phase-4c-schema.sh
          sh scripts/verify-phase-4c-migrations.sh
          sh scripts/verify-phase-4d-migrations.sh
          sh scripts/verify-phase-4d-triggers.sh
          sh scripts/verify-phase-4e-seed.sh
          docker compose --profile tools run --rm --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-5c-repositories.py', run_name='__main__')"
          sh scripts/verify-phase-5d-context.sh
          sh scripts/verify-phase-5e-rls.sh
          sh scripts/verify-phase-5f-rls.sh
          sh scripts/verify-phase-5g-rls.sh
          sh scripts/verify-phase-5h-security.sh
          sh scripts/verify-phase-4f-boundaries.sh
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --volume ./tests/fixtures:/workspace-fixtures:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-7g-employee-lifecycle.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-8b-configuration-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-8c-balance-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-8d-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-8e-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-8f-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-9b-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-9c-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-9d-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-9e-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-9f-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-9f-lifecycle.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-9g-database.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --volume ./scripts:/verification:ro --entrypoint python migrate -c "import runpy; runpy.run_path('/verification/verify-phase-9g-lifecycle.py', run_name='__main__')"
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python migrate /verification/verify-phase-10b-database.py
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python migrate /verification/verify-phase-10c-database.py
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python migrate /verification/verify-phase-10d-database.py
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python migrate /verification/verify-phase-10e-database.py
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python migrate /verification/verify-phase-10f-database.py
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python migrate /verification/verify-phase-10g-database.py
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python migrate /verification/verify-phase-10h-database.py
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python migrate /verification/verify-phase-10i-database.py
          docker compose run --rm --no-deps --env PYTHONPATH=/app --volume ./scripts:/verification:ro backend python /verification/verify-phase-11b-database.py
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python migrate /verification/verify-phase-11c-database.py
          docker compose --profile tools run --rm --env-from-file ./backend/.env.postgres --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python migrate /verification/verify-phase-11d-database.py
      - name: Verify service health
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health | jq --exit-status '.status == "ok" and .database == "ok"'
          curl --fail --silent --show-error http://127.0.0.1:9000/health/ready | jq --exit-status '.status == "UP"'
      - name: Verify Phase 6B HTTP boundary
        run: python scripts/verify-phase-6b-http.py
      - name: Configure access-token subject
        run: python scripts/configure-phase-3d-keycloak.py
      - name: Verify Keycloak configuration idempotence
        if: needs.changes.outputs.auth_deep == 'true'
        run: python scripts/configure-phase-3d-keycloak.py
      - name: Verify Keycloak realm boundary
        run: test "$(docker compose exec -T postgres psql --username postgres --dbname keycloak --tuples-only --no-align --command "SELECT count(*) FROM realm;")" = "2"
      - name: Verify initial service log safety
        run: sh scripts/verify-phase-3h-logs.sh
      - name: Record persisted state
        run: |
          docker compose --profile tools run --rm --no-deps --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python storage-reconciler /verification/verify-phase-8d-storage-restart.py prepare
          docker compose run --rm --no-deps --env-from-file ./backend/.env.migration --env PYTHONPATH=/app --volume ./scripts:/verification:ro backend python /verification/verify-phase-11b-restart.py prepare
          sh scripts/database-persistence-fingerprint.sh > /tmp/workloop-database-fingerprint
          curl --fail --silent --show-error http://127.0.0.1:8080/realms/workloop-dev/protocol/openid-connect/certs | jq -r '.keys[].kid' | sort > /tmp/workloop-signing-key-ids
      - name: Recreate local stack without removing data
        env:
          DATABASE_DEEP: ${{ needs.changes.outputs.database_deep }}
        run: |
          docker compose down
          docker volume inspect workloop-clinic_postgres_data >/dev/null
          docker compose up --detach --wait postgres backend keycloak seaweed-s3
          docker compose --profile tools run --rm migrate
          sh scripts/database-persistence-fingerprint.sh > /tmp/workloop-restarted-database-fingerprint
          diff /tmp/workloop-database-fingerprint /tmp/workloop-restarted-database-fingerprint
          curl --fail --silent --show-error http://127.0.0.1:8080/realms/workloop-dev/protocol/openid-connect/certs | jq -r '.keys[].kid' | sort > /tmp/workloop-restarted-signing-key-ids
          diff /tmp/workloop-signing-key-ids /tmp/workloop-restarted-signing-key-ids
          docker compose --profile tools run --rm --no-deps --env PYTHONPATH=/app --volume ./scripts:/verification:ro --entrypoint python storage-reconciler /verification/verify-phase-8d-storage-restart.py verify
          docker compose run --rm --no-deps --env-from-file ./backend/.env.migration --env PYTHONPATH=/app --volume ./scripts:/verification:ro backend python /verification/verify-phase-11b-restart.py verify
          if [ "$DATABASE_DEEP" = "true" ]; then
            sh scripts/verify-phase-5d-context.sh
          fi
          python scripts/verify-phase-3c-keycloak.py
          npm run test:migration-auth
      - name: Verify cleanup and backend log safety
        run: |
          test "$(docker compose exec -T postgres psql --username postgres --dbname workloop --tuples-only --no-align --command 'SELECT count(*) FROM companies UNION ALL SELECT count(*) FROM branches UNION ALL SELECT count(*) FROM employees UNION ALL SELECT count(*) FROM app_users UNION ALL SELECT count(*) FROM user_profiles;' | sort -u)" = "0"
          test "$(docker compose exec -T postgres psql --username postgres --dbname keycloak --tuples-only --no-align --command "SELECT count(*) FROM user_entity AS users JOIN realm ON realm.id = users.realm_id WHERE realm.name = 'workloop-dev';")" = "0"
          sh scripts/verify-phase-3h-logs.sh
      - name: Show failure state
        if: failure()
        run: docker compose ps
      - name: Stop temporary stack
        if: always()
        run: docker compose down
