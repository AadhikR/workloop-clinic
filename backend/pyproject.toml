[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "workloop-api"
version = "0.1.0"
description = "Portable FastAPI backend for Workloop Clinic"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.19,<1.20",
  "fastapi>=0.141,<0.142",
  "psycopg[binary,pool]>=3.3,<3.4",
  "pydantic-settings>=2.15,<2.16",
  "sqlalchemy[asyncio]>=2.0.52,<2.1",
  "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pip-tools>=7.6,<7.7",
  "pyright>=1.1.411,<1.2",
  "pytest>=9.1,<9.2",
  "pytest-asyncio>=1.4,<1.5",
  "pytest-cov>=7.1,<7.2",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "tests"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
