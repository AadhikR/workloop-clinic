services:
  migrate:
    env_file:
      - path: ./backend/.env.migration
        required: true
      - path: ./backend/.env.postgres
        required: true
    environment:
      WORKLOOP_FILE_SCANNER_PASSWORD: ${PHASE11B_SCANNER_DB_PASSWORD:?set PHASE11B_SCANNER_DB_PASSWORD}

  backend:
    env_file:
      - path: ./backend/.env.api
        required: true
      - path: ./backend/.env.postgres
        required: true
    environment:
      WORKLOOP_FILE_SCANNER_PASSWORD: ${PHASE11B_SCANNER_DB_PASSWORD:?set PHASE11B_SCANNER_DB_PASSWORD}
      PHASE11B_S3_ENDPOINT: http://seaweed-s3:8333
      PHASE11B_S3_ACCESS_KEY: ${PHASE11B_S3_ACCESS_KEY:?set PHASE11B_S3_ACCESS_KEY}
      PHASE11B_S3_SECRET_KEY: ${PHASE11B_S3_SECRET_KEY:?set PHASE11B_S3_SECRET_KEY}

  file-scanner:
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://workloop_file_scanner:${PHASE11B_SCANNER_DB_PASSWORD:?set PHASE11B_SCANNER_DB_PASSWORD}@postgres:5432/workloop

  postgres:
    environment:
      WORKLOOP_FILE_SCANNER_PASSWORD: ${PHASE11B_SCANNER_DB_PASSWORD:?set PHASE11B_SCANNER_DB_PASSWORD}

  seaweed-s3:
    image: chrislusf/seaweedfs:4.44@sha256:e67e8c385484120b78bff47ba5f4debbca47fbd27ed1a39f016f47e8baea615b
    environment:
      AWS_ACCESS_KEY_ID: ${PHASE11B_S3_ACCESS_KEY:?set PHASE11B_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${PHASE11B_S3_SECRET_KEY:?set PHASE11B_S3_SECRET_KEY}
      S3_BUCKET: workloop-phase11b
    ports:
      - "127.0.0.1:18333:8333"
    volumes:
      - phase11b_s3_data:/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  phase11b_s3_data:
