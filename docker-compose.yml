name: workloop-clinic

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067
    env_file:
      - path: ./backend/.env.keycloak
        required: true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_LOG: console
      KC_LOG_CONSOLE_OUTPUT: json
      KC_LOG_LEVEL: info
      KC_LOG_SERVICE_ENVIRONMENT: local
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    mem_limit: 1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 30s

  migrate:
    build:
      context: ./backend
    image: workloop-api:local
    profiles:
      - tools
    env_file:
      - path: ./backend/.env.migration
        required: true
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    read_only: true
    volumes:
      - ./backend/alembic:/app/alembic
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    image: workloop-api:local
    env_file:
      - path: ./backend/.env.api
        required: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5);
          assert response.status == 200 and json.load(response) == {'status': 'ok', 'database': 'ok'}
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  postgres:
    image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    env_file:
      - path: ./backend/.env.postgres
        required: true
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 128mb
    stop_grace_period: 30s

volumes:
  postgres_data:
